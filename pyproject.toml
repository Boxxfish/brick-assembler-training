[project]
name = "brick-assembler-training"
version = "0.1.0"
description = "Training code for the brick assembler project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium[classic-control]>=1.4.0",
    "pydantic>=2.14.1",
    "safetensors>=0.8.0",
    "tqdm>=4.70.1",
    "wandb>=0.31.0",
]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pyrefly-torch-stubs>=1.4.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"